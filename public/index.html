<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MoviePayload</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #0a0a0a;
            color: #e0e0e0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .container {
            max-width: 600px;
            width: 100%;
            padding: 40px;
        }
        
        h1 {
            font-size: 2rem;
            margin-bottom: 10px;
            color: #fff;
        }
        
        .subtitle {
            color: #888;
            margin-bottom: 30px;
            font-size: 0.9rem;
        }
        
        .drop-zone {
            border: 2px dashed #333;
            border-radius: 12px;
            padding: 60px 40px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s ease;
            background: #111;
        }
        
        .drop-zone:hover {
            border-color: #555;
            background: #1a1a1a;
        }
        
        .drop-zone.dragover {
            border-color: #0070f3;
            background: #0d1b2a;
        }
        
        .drop-zone-text {
            color: #666;
            font-size: 1rem;
        }
        
        .file-input {
            display: none;
        }
        
        .file-info {
            margin-top: 20px;
            padding: 15px;
            background: #111;
            border-radius: 8px;
            display: none;
        }
        
        .file-info.show {
            display: block;
        }
        
        .file-name {
            color: #fff;
            font-weight: 500;
            margin-bottom: 5px;
        }
        
        .file-size {
            color: #666;
            font-size: 0.85rem;
        }
        
        .btn {
            width: 100%;
            padding: 14px;
            margin-top: 20px;
            background: #0070f3;
            color: #fff;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 500;
            cursor: pointer;
            transition: background 0.2s;
            display: none;
        }
        
        .btn.show {
            display: block;
        }
        
        .btn:hover {
            background: #0051cc;
        }
        
        .btn:disabled {
            background: #333;
            cursor: not-allowed;
        }
        
        .status {
            margin-top: 20px;
            padding: 15px;
            border-radius: 8px;
            display: none;
        }
        
        .status.show {
            display: block;
        }
        
        .status.processing {
            background: #1a1a2e;
            color: #0070f3;
        }
        
        .status.success {
            background: #0d2818;
            color: #00d084;
        }
        
        .status.error {
            background: #2a0d0d;
            color: #ff4444;
        }
        
        .progress-bar {
            width: 100%;
            height: 4px;
            background: #222;
            border-radius: 2px;
            margin-top: 10px;
            overflow: hidden;
        }
        
        .progress-fill {
            height: 100%;
            background: #0070f3;
            width: 0%;
            transition: width 0.3s ease;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>MoviePayload</h1>
        <p class="subtitle">Upload your links.txt file to generate a zip archive</p>
        
        <div class="drop-zone" id="dropZone">
            <p class="drop-zone-text">Drag & drop your file here or click to browse</p>
            <input type="file" class="file-input" id="fileInput" accept=".txt">
        </div>
        
        <div class="file-info" id="fileInfo">
            <div class="file-name" id="fileName"></div>
            <div class="file-size" id="fileSize"></div>
        </div>
        
        <button class="btn" id="generateBtn">Generate ZIP</button>
        
        <div class="status" id="status">
            <div id="statusText"></div>
            <div class="progress-bar" id="progressBar" style="display: none;">
                <div class="progress-fill" id="progressFill"></div>
            </div>
        </div>
    </div>

    <script>
        const dropZone = document.getElementById('dropZone');
        const fileInput = document.getElementById('fileInput');
        const fileInfo = document.getElementById('fileInfo');
        const fileName = document.getElementById('fileName');
        const fileSize = document.getElementById('fileSize');
        const generateBtn = document.getElementById('generateBtn');
        const status = document.getElementById('status');
        const statusText = document.getElementById('statusText');
        const progressBar = document.getElementById('progressBar');
        const progressFill = document.getElementById('progressFill');
        
        let selectedFile = null;
        
        dropZone.addEventListener('click', () => fileInput.click());
        
        dropZone.addEventListener('dragover', (e) => {
            e.preventDefault();
            dropZone.classList.add('dragover');
        });
        
        dropZone.addEventListener('dragleave', () => {
            dropZone.classList.remove('dragover');
        });
        
        dropZone.addEventListener('drop', (e) => {
            e.preventDefault();
            dropZone.classList.remove('dragover');
            
            const files = e.dataTransfer.files;
            if (files.length > 0) {
                handleFile(files[0]);
            }
        });
        
        fileInput.addEventListener('change', (e) => {
            if (e.target.files.length > 0) {
                handleFile(e.target.files[0]);
            }
        });
        
        function handleFile(file) {
            selectedFile = file;
            fileName.textContent = file.name;
            fileSize.textContent = formatFileSize(file.size);
            fileInfo.classList.add('show');
            generateBtn.classList.add('show');
        }
        
        function formatFileSize(bytes) {
            if (bytes === 0) return '0 Bytes';
            const k = 1024;
            const sizes = ['Bytes', 'KB', 'MB', 'GB'];
            const i = Math.floor(Math.log(bytes) / Math.log(k));
            return parseFloat((bytes / Math.pow(k, i)).toFixed(2)) + ' ' + sizes[i];
        }
        
        generateBtn.addEventListener('click', async () => {
            if (!selectedFile) return;
            
            generateBtn.disabled = true;
            status.classList.add('show', 'processing');
            statusText.textContent = 'Reading file...';
            progressBar.style.display = 'block';
            progressFill.style.width = '10%';
            
            try {
                const text = await selectedFile.text();
                progressFill.style.width = '30%';
                
                statusText.textContent = 'Processing URLs...';
                progressFill.style.width = '50%';
                
                const response = await fetch('/api/generate', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'text/plain'
                    },
                    body: text
                });
                
                if (!response.ok) {
                    throw new Error('Failed to generate zip');
                }
                
                progressFill.style.width = '80%';
                
                const blob = await response.blob();
                const url = window.URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = 'movies.zip';
                document.body.appendChild(a);
                a.click();
                window.URL.revokeObjectURL(url);
                document.body.removeChild(a);
                
                progressFill.style.width = '100%';
                status.classList.remove('processing');
                status.classList.add('success');
                statusText.textContent = 'ZIP downloaded successfully!';
                
                setTimeout(() => {
                    status.classList.remove('show');
                    progressBar.style.display = 'none';
                    progressFill.style.width = '0%';
                    generateBtn.disabled = false;
                }, 3000);
                
            } catch (error) {
                status.classList.remove('processing');
                status.classList.add('error');
                statusText.textContent = 'Error: ' + error.message;
                generateBtn.disabled = false;
            }
        });
    </script>
</body>
</html>
